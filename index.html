<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBillBook Style Invoice</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .invoice-card { background: #fff; max-width: 900px; margin: auto; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #3498db; padding-bottom: 20px; margin-bottom: 20px; }
        .header h2 { color: #3498db; margin: 0; }
        .bill-details { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .bill-details input { border: 1px solid #ddd; padding: 8px; border-radius: 4px; margin-top: 5px; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        table th { background: #3498db; color: white; padding: 12px; text-align: left; }
        table td { padding: 10px; border-bottom: 1px solid #eee; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        
        .totals { float: right; width: 300px; }
        .totals div { display: flex; justify-content: space-between; padding: 5px 0; }
        .grand-total { font-weight: bold; font-size: 1.2rem; color: #e74c3c; border-top: 2px solid #eee; margin-top: 10px; padding-top: 10px; }
        
        .buttons { margin-top: 30px; clear: both; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-add { background: #27ae60; color: white; }
        .btn-print { background: #34495e; color: white; }
        
        /* Print Styles */
        @media print {
            .btn, .remove-btn { display: none; }
            body { background: white; padding: 0; }
            .invoice-card { box-shadow: none; border: none; max-width: 100%; }
        }
        .remove-btn { color: red; cursor: pointer; font-weight: bold; border: none; background: none; }
    </style>
</head>
<body>

<div class="invoice-card" id="invoice">
    <div class="header">
        <div>
            <h2>APNI DUKAN</h2>
            <p>Nagpur, Maharashtra, India<br>GSTIN: 27AAAAA0000A1Z5</p>
        </div>
        <div style="text-align: right;">
            <h1>INVOICE</h1>
            <p>Date: <input type="date" id="currentDate"></p>
        </div>
    </div>

    <div class="bill-details">
        <div>
            <strong>Bill To:</strong><br>
            <input type="text" placeholder="Customer Name"><br>
            <input type="text" placeholder="Phone Number">
        </div>
        <div>
            <strong>Invoice No:</strong><br>
            <input type="text" value="#INV-1001">
        </div>
    </div>

    <table id="itemTable">
        <thead>
            <tr>
                <th width="5%">#</th>
                <th width="40%">Item Description</th>
                <th width="15%">Qty</th>
                <th width="20%">Price</th>
                <th width="20%">Total</th>
                <th width="5%"></th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td><input type="text" placeholder="Item Name"></td>
                <td><input type="number" class="qty" value="1" oninput="calculate()"></td>
                <td><input type="number" class="price" value="0" oninput="calculate()"></td>
                <td><span class="row-total">0.00</span></td>
                <td></td>
            </tr>
        </tbody>
    </table>

    <button class="btn btn-add" onclick="addRow()">+ Add Item</button>

    <div class="totals">
        <div>
            <span>Subtotal:</span>
            <span>₹<span id="subtotal">0.00</span></span>
        </div>
        <div>
            <span>GST (18%):</span>
            <span>₹<span id="gst">0.00</span></span>
        </div>
        <div class="grand-total">
            <span>Grand Total:</span>
            <span>₹<span id="grandTotal">0.00</span></span>
        </div>
    </div>

    <div class="buttons">
        <button class="btn btn-print" onclick="window.print()">Print Invoice</button>
    </div>
</div>

<script>
    // Aaj ki date set karne ke liye
    document.getElementById('currentDate').valueAsDate = new Date();

    function addRow() {
        const table = document.getElementById('itemTable').getElementsByTagName('tbody')[0];
        const rowCount = table.rows.length + 1;
        const row = table.insertRow();
        row.innerHTML = `
            <td>${rowCount}</td>
            <td><input type="text" placeholder="Item Name"></td>
            <td><input type="number" class="qty" value="1" oninput="calculate()"></td>
            <td><input type="number" class="price" value="0" oninput="calculate()"></td>
            <td><span class="row-total">0.00</span></td>
            <td><button class="remove-btn" onclick="removeRow(this)">X</button></td>
        `;
    }

    function removeRow(btn) {
        const row = btn.parentNode.parentNode;
        row.parentNode.removeChild(row);
        calculate();
    }

    function calculate() {
        let subtotal = 0;
        const rows = document.querySelectorAll('#itemTable tbody tr');
        
        rows.forEach(row => {
            const qty = row.querySelector('.qty').value || 0;
            const price = row.querySelector('.price').value || 0;
            const total = qty * price;
            row.querySelector('.row-total').innerText = total.toFixed(2);
            subtotal += total;
        });

        const gst = subtotal * 0.18; // 18% GST
        const grandTotal = subtotal + gst;

        document.getElementById('subtotal').innerText = subtotal.toFixed(2);
        document.getElementById('gst').innerText = gst.toFixed(2);
        document.getElementById('grandTotal').innerText = grandTotal.toFixed(2);
    }
</script>

</body>
</html>
