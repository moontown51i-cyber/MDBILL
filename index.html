<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Billing System</title>
    <style>
        :root { --primary: #2563eb; --secondary: #64748b; --dark: #1e293b; --light: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: #e2e8f0; margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 1000px; margin: auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        /* Toolbar */
        .toolbar { display: flex; justify-content: space-between; margin-bottom: 30px; background: var(--light); padding: 15px; border-radius: 8px; border: 1px solid #cbd5e1; }
        
        /* Header Section */
        .invoice-header { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .business-info input, .bill-to input { display: block; width: 100%; border: 1px solid transparent; padding: 5px; font-size: 14px; margin-bottom: 5px; }
        .business-info input:hover, .bill-to input:hover { border-color: #ddd; background: #fff; }
        .business-name { font-size: 24px !important; font-weight: bold; color: var(--primary); }
        
        /* Table Styling */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: var(--primary); color: white; padding: 12px; text-align: left; }
        td { border-bottom: 1px solid #e2e8f0; padding: 10px; }
        input { border: 1px solid #cbd5e1; padding: 8px; border-radius: 4px; width: 100%; box-sizing: border-box; }
        
        /* Calculations Area */
        .summary-wrapper { display: flex; justify-content: flex-end; margin-top: 30px; }
        .summary-table { width: 300px; }
        .summary-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f5f9; }
        .grand-total { font-size: 20px; font-weight: bold; color: var(--primary); border-top: 2px solid var(--primary); margin-top: 10px; }

        /* Buttons */
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn-add { background: var(--primary); color: white; margin-top: 10px; }
        .btn-print { background: #059669; color: white; font-size: 16px; }
        .btn-danger { background: #ef4444; color: white; padding: 5px 10px; }
        
        .footer-note { margin-top: 50px; border-top: 1px solid #e2e8f0; padding-top: 20px; }

        @media print {
            .toolbar, .btn-add, .btn-danger, .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: none; width: 100%; max-width: 100%; }
            input { border: none !important; background: transparent !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Action Toolbar -->
    <div class="toolbar no-print">
        <h2 style="margin:0">Billing Software</h2>
        <div>
            <button class="btn btn-print" onclick="window.print()">Print / Save PDF</button>
            <button class="btn" style="background:#64748b; color:white" onclick="saveSettings()">Save Shop Info</button>
        </div>
    </div>

    <!-- Invoice Header -->
    <div class="invoice-header">
        <div class="business-info">
            <input type="text" id="shopName" class="business-name" placeholder="Your Business Name">
            <input type="text" id="shopAddress" placeholder="Address, City, State">
            <input type="text" id="shopGST" placeholder="GSTIN: 27XXXXX0000X1Z1">
            <input type="text" id="shopPhone" placeholder="Phone: +91 0000000000">
        </div>
        <div style="text-align: right;">
            <h1 style="color:var(--secondary); margin:0">INVOICE</h1>
            <p>Invoice No: <input type="text" value="#INV-001" style="width:100px; text-align:right"></p>
            <p>Date: <input type="date" id="invDate" style="width:150px"></p>
        </div>
    </div>

    <hr>

    <!-- Customer Section -->
    <div class="bill-to">
        <strong>Bill To:</strong>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px;">
            <input type="text" placeholder="Customer Name">
            <input type="text" placeholder="Customer Contact / GST">
        </div>
    </div>

    <!-- Items Table -->
    <table id="invoiceTable">
        <thead>
            <tr>
                <th width="40%">Item Description</th>
                <th width="10%">Qty</th>
                <th width="15%">Price</th>
                <th width="10%">Disc%</th>
                <th width="10%">GST%</th>
                <th width="15%">Amount</th>
                <th class="no-print" width="5%"></th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="text" placeholder="Product Name"></td>
                <td><input type="number" class="qty" value="1" oninput="updateTotal()"></td>
                <td><input type="number" class="price" value="0" oninput="updateTotal()"></td>
                <td><input type="number" class="disc" value="0" oninput="updateTotal()"></td>
                <td><input type="number" class="tax" value="18" oninput="updateTotal()"></td>
                <td style="font-weight:bold">₹<span class="rowTotal">0.00</span></td>
                <td class="no-print"></td>
            </tr>
        </tbody>
    </table>
    <button class="btn btn-add no-print" onclick="addRow()">+ Add Item</button>

    <!-- Summary Section -->
    <div class="summary-wrapper">
        <div class="summary-table">
            <div class="summary-row">
                <span>Sub Total:</span>
                <span>₹<span id="subTotal">0.00</span></span>
            </div>
            <div class="summary-row">
                <span>Total Tax:</span>
                <span>₹<span id="totalTax">0.00</span></span>
            </div>
            <div class="summary-row grand-total">
                <span>Grand Total:</span>
                <span>₹<span id="grandTotal">0.00</span></span>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer-note">
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 50px;">
            <div>
                <strong>Notes / Terms:</strong>
                <textarea style="width:100%; border:none; background:#f8fafc; margin-top:5px; height:60px; padding:10px" placeholder="Thanks for your business!"></textarea>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <div style="border-bottom: 1px solid #333; height: 40px;"></div>
                <p>Authorized Signatory</p>
            </div>
        </div>
    </div>
</div>

<script>
    // Set Current Date
    document.getElementById('invDate').valueAsDate = new Date();

    // Load Saved Shop Data
    window.onload = function() {
        if(localStorage.getItem('shopName')) {
            document.getElementById('shopName').value = localStorage.getItem('shopName');
            document.getElementById('shopAddress').value = localStorage.getItem('shopAddress');
            document.getElementById('shopGST').value = localStorage.getItem('shopGST');
            document.getElementById('shopPhone').value = localStorage.getItem('shopPhone');
        }
    }

    function saveSettings() {
        localStorage.setItem('shopName', document.getElementById('shopName').value);
        localStorage.setItem('shopAddress', document.getElementById('shopAddress').value);
        localStorage.setItem('shopGST', document.getElementById('shopGST').value);
        localStorage.setItem('shopPhone', document.getElementById('shopPhone').value);
        alert("Shop Details Saved Locally!");
    }

    function addRow() {
        const table = document.getElementById('invoiceTable').getElementsByTagName('tbody')[0];
        const row = table.insertRow();
        row.innerHTML = `
            <td><input type="text" placeholder="Product Name"></td>
            <td><input type="number" class="qty" value="1" oninput="updateTotal()"></td>
            <td><input type="number" class="price" value="0" oninput="updateTotal()"></td>
            <td><input type="number" class="disc" value="0" oninput="updateTotal()"></td>
            <td><input type="number" class="tax" value="18" oninput="updateTotal()"></td>
            <td style="font-weight:bold">₹<span class="rowTotal">0.00</span></td>
            <td class="no-print"><button class="btn-danger" onclick="this.parentElement.parentElement.remove(); updateTotal()">X</button></td>
        `;
    }

    function updateTotal() {
        let subTotal = 0;
        let totalTax = 0;
        const rows = document.querySelectorAll('#invoiceTable tbody tr');

        rows.forEach(row => {
            const qty = parseFloat(row.querySelector('.qty').value) || 0;
            const price = parseFloat(row.querySelector('.price').value) || 0;
            const disc = parseFloat(row.querySelector('.disc').value) || 0;
            const taxRate = parseFloat(row.querySelector('.tax').value) || 0;

            // Calculation
            const priceAfterDisc = price - (price * (disc / 100));
            const baseAmount = priceAfterDisc * qty;
            const taxAmount = baseAmount * (taxRate / 100);
            const rowTotal = baseAmount + taxAmount;

            row.querySelector('.rowTotal').innerText = rowTotal.toFixed(2);
            
            subTotal += baseAmount;
            totalTax += taxAmount;
        });

        document.getElementById('subTotal').innerText = subTotal.toFixed(2);
        document.getElementById('totalTax').innerText = totalTax.toFixed(2);
        document.getElementById('grandTotal').innerText = (subTotal + totalTax).toFixed(2);
    }
</script>

</body>
</html>
