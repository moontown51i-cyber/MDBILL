<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BillingHub Enterprise | Real-Time Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Firebase SDKs for Real-Time Sync -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --inv-font-size: 13px; --primary-color: #4f46e5; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f1f5f9; height: 100vh; overflow: hidden; margin: 0; }
        .app-grid { display: flex; height: 100vh; width: 100%; flex-direction: column; }
        @media (min-width: 1024px) { .app-grid { display: grid; grid-template-columns: 240px 42% 1fr; flex-direction: row; } }
        .sidebar { background: #0f172a; color: white; padding: 25px 15px; display: none; flex-direction: column; height: 100%; }
        @media (min-width: 1024px) { .sidebar { display: flex !important; } }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #94a3b8; font-weight: 600; border-radius: 12px; transition: 0.2s; margin-bottom: 5px; width: 100%; text-align: left; }
        .nav-link.active { background: var(--primary-color); color: white; }
        .form-col { flex: 1; background: #f8fafc; padding: 20px; overflow-y: auto; padding-bottom: 100px; }
        .preview-col { background: #475569; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; position: fixed; inset: 0; z-index: 2000; visibility: hidden; opacity: 0; transition: 0.3s; }
        .preview-col.show { visibility: visible; opacity: 1; }
        @media (min-width: 1024px) { .preview-col { position: relative; visibility: visible; opacity: 1; z-index: 1; padding: 30px; } }
        #invoice-preview { background: white; width: 210mm; min-height: 297mm; padding: 15mm; transform-origin: top center; font-size: var(--inv-font-size); position: relative; }
        .card { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 15px; border: 1px solid #f1f5f9; }
        .input-box { width: 100%; background: #f1f5f9; padding: 12px; border-radius: 12px; border: 1px solid transparent; outline: none; font-size: 14px; font-weight: 600; }
        .item-edit-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; background: #f8fafc; padding: 12px; border-radius: 15px; position: relative; }
        @media (min-width: 1024px) { .item-edit-row { grid-template-columns: 1.5fr 1fr 60px 90px 30px; background: transparent; padding: 0; } }
        #sync-status { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; padding: 8px 16px; border-radius: 50px; font-size: 12px; font-weight: bold; display: none; }
        .mobile-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #e2e8f0; z-index: 1000; }
        @media (min-width: 1024px) { .mobile-nav { display: none; } }
    </style>
</head>
<body>

<div id="sync-status"></div>

<div class="app-grid">
    <aside class="sidebar">
        <div class="mb-10 px-2">
            <h1 class="text-2xl font-black italic text-indigo-400">BillingHub</h1>
            <p class="text-[9px] uppercase font-bold text-slate-500 tracking-[3px]">Universal Cloud v15.0</p>
        </div>
        
        <div class="mb-6 px-2">
            <label class="text-[10px] font-bold text-slate-500 block mb-2 uppercase">Real-Time Sync ID</label>
            <div class="flex gap-2">
                <input type="password" id="sync-key" class="bg-slate-800 border-none rounded-lg p-2 text-xs w-full text-white" placeholder="Mobile No. / Key">
                <button onclick="initializeCloudSync()" class="bg-indigo-600 px-3 rounded-lg"><i class="fas fa-link"></i></button>
            </div>
            <p class="text-[9px] text-slate-500 mt-1">Live sync active on all devices with this ID.</p>
        </div>

        <nav class="flex-1">
            <button onclick="switchModule('billing')" id="m-billing" class="nav-link active"><i class="fas fa-file-invoice"></i> Billing</button>
            <button onclick="switchModule('inventory')" id="m-inventory" class="nav-link"><i class="fas fa-boxes-stacked"></i> Inventory</button>
            <button onclick="switchModule('parties')" id="m-parties" class="nav-link"><i class="fas fa-users"></i> Parties</button>
        </nav>
        
        <div class="pt-6 border-t border-slate-800 space-y-4">
            <div class="flex items-center justify-between px-2">
                <span class="text-[10px] font-bold text-slate-400">LIVE NOTIFICATIONS</span>
                <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
            </div>
            <button onclick="saveShopProfile()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-black text-[10px] uppercase">Update Shop Info</button>
        </div>
    </aside>

    <main class="form-col no-print">
        <div id="mod-billing">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black text-slate-800 lg:text-2xl">Create Document</h2>
                <div class="flex gap-2">
                    <button onclick="downloadPDF()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold text-xs"><i class="fas fa-download"></i> PDF</button>
                    <button onclick="window.print()" class="bg-slate-800 text-white px-4 py-2 rounded-xl font-bold text-xs"><i class="fas fa-print"></i> Print</button>
                </div>
            </div>

            <div class="card grid grid-cols-2 gap-3 bg-indigo-50/50">
                <select id="doc-type" class="input-box col-span-2" onchange="updatePreview()">
                    <option value="INVOICE">Standard Invoice</option>
                    <option value="TAX INVOICE">Tax Invoice (GST)</option>
                    <option value="QUOTATION">Official Quotation</option>
                    <option value="ESTIMATE">Estimate / Proforma</option>
                </select>
            </div>

            <div class="card space-y-3">
                <select id="party-select" class="input-box" onchange="loadPartyData()"><option value="new">+ Select Saved Party</option></select>
                <input type="text" id="cust-name" placeholder="Party Name" class="input-box" oninput="updatePreview()">
                <textarea id="cust-info" placeholder="Address & Contact" class="input-box h-16" oninput="updatePreview()"></textarea>
            </div>

            <div class="card">
                <label class="text-[10px] font-black text-slate-400 uppercase mb-3 block">Items</label>
                <div class="relative mb-4">
                    <input type="text" id="product-search" placeholder="Search saved products..." class="input-box pl-10" oninput="searchProducts(this.value)">
                    <i class="fas fa-search absolute left-4 top-3.5 text-slate-400"></i>
                    <div id="search-results" class="absolute z-[100] w-full bg-white shadow-xl rounded-xl mt-1 hidden border"></div>
                </div>
                <div id="bill-items-container"></div>
                <button onclick="addItemRow()" class="w-full mt-4 py-3 border-2 border-dashed border-slate-200 rounded-xl text-slate-400 font-bold hover:text-indigo-600">+ Custom Row</button>
            </div>

            <button onclick="finalizeTransaction()" class="w-full bg-[#0f172a] text-white py-5 rounded-3xl font-black text-lg uppercase shadow-2xl mb-8">Finalize & Update All Devices</button>
        </div>

        <div id="mod-inventory" class="hidden">
            <div class="flex justify-between items-center mb-6"><h3>Inventory Management</h3><button onclick="quickAddProduct()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold">+ New Item</button></div>
            <div id="stock-list" class="space-y-3"></div>
        </div>
        
        <div id="mod-parties" class="hidden">
            <div class="flex justify-between items-center mb-6"><h3>Parties</h3><button onclick="quickAddParty()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold">+ New Party</button></div>
            <div id="party-list" class="space-y-2"></div>
        </div>
    </main>

    <section class="preview-col" id="preview-panel">
        <div id="invoice-preview"><div id="template-render-target"></div></div>
    </section>

    <nav class="mobile-nav no-print">
        <button onclick="switchModule('billing')" class="m-nav-item">Bill</button>
        <button onclick="switchModule('inventory')" class="m-nav-item">Stock</button>
        <button onclick="switchModule('parties')" class="m-nav-item">Parties</button>
        <button onclick="togglePreview()" class="m-nav-item text-indigo-600">View</button>
    </nav>
</div>

<script>
    // --- REAL-TIME CLOUD CORE (Firebase) ---
    // Public fallback config - In production, replace with your actual Firebase config
    const firebaseConfig = {
        databaseURL: "https://billing-hub-default-rtdb.firebaseio.com" 
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const database = firebase.database();
    let currentSyncRef = null;

    let db = {
        shop: { name: "MY BUSINESS", info: "Address Line 1" },
        stock: [],
        parties: [],
        sales: [],
        settings: { nextInv: 1001, terms: "1. Goods once sold not taken back." }
    };

    function initializeCloudSync() {
        const key = document.getElementById('sync-key').value;
        if(!key) return alert("Please enter a Sync ID");
        
        localStorage.setItem('bh_sync_key', key);
        
        // Detach previous listener if exists
        if(currentSyncRef) currentSyncRef.off();

        showStatus("Connecting Live...", "bg-indigo-600 text-white");

        // Set up Real-time Listener
        currentSyncRef = database.ref('users/' + key);
        currentSyncRef.on('value', (snapshot) => {
            const cloudData = snapshot.val();
            if (cloudData) {
                db = cloudData;
                showStatus("Sync: Real-Time Active", "bg-emerald-500 text-white");
                loadGlobalData();
                updatePreview();
            } else {
                // Initialize new cloud profile with local defaults
                pushToCloud();
            }
        });
    }

    async function pushToCloud() {
        const key = localStorage.getItem('bh_sync_key');
        if(!key || !currentSyncRef) return;
        
        try {
            await currentSyncRef.set(db);
        } catch (e) { 
            console.error("Cloud Sync Error", e);
            showStatus("Sync Error", "bg-red-500 text-white");
        }
    }

    function showStatus(msg, classes) {
        const s = document.getElementById('sync-status');
        s.innerText = msg;
        s.className = classes;
        s.style.display = 'block';
        setTimeout(() => s.style.display = 'none', 2000);
    }

    // --- APP LOGIC ---

    window.onload = () => {
        const savedKey = localStorage.getItem('bh_sync_key');
        if(savedKey) {
            document.getElementById('sync-key').value = savedKey;
            initializeCloudSync();
        }
        addItemRow();
    };

    function loadGlobalData() {
        const pSel = document.getElementById('party-select');
        const currentVal = pSel.value;
        pSel.innerHTML = '<option value="new">+ Select Saved Party</option>';
        db.parties.forEach(p => { 
            let opt = document.createElement('option'); 
            opt.value = p.id; opt.innerText = p.name; 
            pSel.appendChild(opt); 
        });
        pSel.value = currentVal;
        renderInventory();
        renderPartiesList();
    }

    function switchModule(mod) {
        ['mod-billing', 'mod-inventory', 'mod-parties'].forEach(m => document.getElementById(m).classList.add('hidden'));
        document.getElementById('mod-' + mod).classList.remove('hidden');
    }

    function quickAddProduct() {
        const n = prompt("Product Name:");
        const p = prompt("Price:");
        if(n && p) {
            if(!db.stock) db.stock = [];
            db.stock.push({ id: Date.now(), name: n, price: parseFloat(p) });
            pushToCloud();
        }
    }

    function renderInventory() {
        if(!db.stock) return;
        document.getElementById('stock-list').innerHTML = db.stock.map(p => `
            <div class="card flex justify-between items-center">
                <span><b>${p.name}</b> - ₹${p.price}</span>
                <button onclick="deleteProduct(${p.id})" class="text-red-400">Delete</button>
            </div>
        `).join('');
    }

    function deleteProduct(id) {
        db.stock = db.stock.filter(x => x.id != id);
        pushToCloud();
    }

    function quickAddParty() {
        const n = prompt("Party Name:");
        const i = prompt("Address:");
        if(n) {
            if(!db.parties) db.parties = [];
            db.parties.push({ id: Date.now(), name: n, info: i });
            pushToCloud();
        }
    }

    function renderPartiesList() {
        if(!db.parties) return;
        document.getElementById('party-list').innerHTML = db.parties.map(p => `
            <div class="card flex justify-between items-center">
                <span><b>${p.name}</b></span>
                <button onclick="deleteParty(${p.id})" class="text-red-400">Delete</button>
            </div>
        `).join('');
    }

    function deleteParty(id) {
        db.parties = db.parties.filter(x => x.id != id);
        pushToCloud();
    }

    function addItemRow(prod = null) {
        const id = Date.now();
        const html = `<div class="item-edit-row" id="row-${id}">
            <select class="p-id input-box" onchange="const p=db.stock.find(x=>x.id==this.value); if(p) this.parentElement.querySelector('.p-rate').value=p.price; updatePreview()">
                <option value="">Select Item</option>${db.stock ? db.stock.map(p => `<option value="${p.id}" ${prod && prod.id==p.id?'selected':''}>${p.name}</option>`).join('') : ''}
            </select>
            <input type="text" placeholder="Note" class="p-desc input-box" oninput="updatePreview()">
            <input type="number" placeholder="Qty" class="p-qty input-box" value="1" oninput="updatePreview()">
            <input type="number" placeholder="Rate" class="p-rate input-box" value="${prod?prod.price:''}" oninput="updatePreview()">
            <button onclick="this.parentElement.remove(); updatePreview()" class="text-red-400">X</button>
        </div>`;
        document.getElementById('bill-items-container').insertAdjacentHTML('beforeend', html);
    }

    function updatePreview() {
        const docType = document.getElementById('doc-type').value;
        const custName = document.getElementById('cust-name').value || "Walk-in Customer";
        const custInfo = document.getElementById('cust-info').value || "";
        
        let sub = 0, itemsHtml = '';
        document.querySelectorAll('.item-edit-row').forEach(row => {
            const sid = row.querySelector('.p-id').value;
            const pObj = db.stock ? db.stock.find(x => x.id == sid) : null;
            if(pObj) {
                const q = parseFloat(row.querySelector('.p-qty').value) || 0;
                const r = parseFloat(row.querySelector('.p-rate').value) || 0;
                const t = q * r; sub += t;
                itemsHtml += `<tr><td style="padding:8px 0; border-bottom:1px solid #eee;">${pObj.name}</td><td style="text-align:center;">${q}</td><td style="text-align:right;">₹${r}</td><td style="text-align:right;">₹${t}</td></tr>`;
            }
        });

        document.getElementById('template-render-target').innerHTML = `
            <div style="border-bottom:5px solid #4f46e5; padding-bottom:15px; margin-bottom:20px; display:flex; justify-content:space-between;">
                <div><h1 style="font-size:24px; margin:0; color:#4f46e5">${db.shop.name}</h1><p style="font-size:10px;">${db.shop.info}</p></div>
                <div style="text-align:right;"><h3>${docType}</h3><p>#${db.settings.nextInv}</p></div>
            </div>
            <div style="margin-bottom:20px;">
                <h4 style="margin:0;">Bill To:</h4>
                <p style="margin:0; font-weight:bold;">${custName}</p>
                <p style="margin:0; font-size:11px;">${custInfo}</p>
            </div>
            <table style="width:100%; border-collapse:collapse;">
                <thead style="background:#f8fafc; font-size:11px;"><tr><th style="text-align:left; padding:8px;">Item</th><th>Qty</th><th style="text-align:right;">Rate</th><th style="text-align:right;">Total</th></tr></thead>
                <tbody>${itemsHtml}</tbody>
            </table>
            <div style="text-align:right; margin-top:20px; font-size:18px; font-weight:bold; color:#4f46e5;">TOTAL: ₹${sub}</div>
        `;
    }

    function finalizeTransaction() {
        db.settings.nextInv++;
        pushToCloud();
        alert("Success! Invoice number updated and synced across all devices.");
    }

    function togglePreview() { document.getElementById('preview-panel').classList.toggle('show'); }
    
    function downloadPDF() { 
        const element = document.getElementById('invoice-preview');
        html2pdf().from(element).save(); 
    }

    function searchProducts(query) {
        const res = document.getElementById('search-results');
        if (query.length < 1 || !db.stock) { res.classList.add('hidden'); return; }
        const filt = db.stock.filter(p => p.name.toLowerCase().includes(query.toLowerCase()));
        if (filt.length > 0) {
            res.innerHTML = filt.map(p => `<div onclick="addItemRow({id:'${p.id}', name:'${p.name}', price:${p.price}}); document.getElementById('product-search').value=''; document.getElementById('search-results').classList.add('hidden');" class="p-3 border-b text-sm font-bold hover:bg-indigo-50 cursor-pointer">${p.name} - ₹${p.price}</div>`).join('');
            res.classList.remove('hidden');
        } else res.classList.add('hidden');
    }

    function saveShopProfile() {
        const n = prompt("Shop Name:", db.shop.name);
        const i = prompt("Shop Details:", db.shop.info);
        if(n) db.shop.name = n;
        if(i) db.shop.info = i;
        pushToCloud();
    }

    function loadPartyData() {
        const p = db.parties.find(x => x.id == document.getElementById('party-select').value);
        if(p) { document.getElementById('cust-name').value = p.name; document.getElementById('cust-info').value = p.info; updatePreview(); }
    }
</script>
</body>
</html>
